[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bogoprice"
version = "1.0.0"
description = "Precio de referencia por noche para alojamientos de corta estancia en Bogotá (MIAD, Grupo 6)"
requires-python = ">=3.10"
# Paquete de entrenamiento: limpieza, variables, experimentos (MLflow) y modelo final
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "lightgbm>=4.3",
    "mlflow>=3.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Pruebas de la API: python -m pytest (desde la raíz) o desde api/
testpaths = ["api/app/tests"]
